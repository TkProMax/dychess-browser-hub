<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DYCHESS Leaderboard</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #080d0a;
      color: #f5f5ed;
      font-family: Arial, sans-serif;
    }

    header {
      background: #102319;
      border-bottom: 1px solid #c9a64b66;
      padding: 16px 20px;
    }

    nav {
      max-width: 1100px;
      margin: auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .brand {
      color: #d6b45a;
      font-weight: 900;
      letter-spacing: 2px;
    }

    nav a {
      color: #f5f5ed;
      text-decoration: none;
      margin-left: 14px;
      font-size: 14px;
    }

    nav a:hover { color: #d6b45a; }

    main {
      max-width: 1100px;
      margin: auto;
      padding: 38px 20px 60px;
    }

    .eyebrow {
      color: #d6b45a;
      font-size: 12px;
      font-weight: bold;
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    h1 {
      font-size: clamp(30px, 5vw, 46px);
      margin: 10px 0;
    }

    .intro {
      color: #c5d0c8;
      margin-bottom: 28px;
    }

    .panel {
      background: #101b14;
      border: 1px solid #c9a64b44;
      border-radius: 14px;
      padding: 20px;
      overflow-x: auto;
    }

    .panel h2 {
      margin-top: 0;
      color: #d6b45a;
      font-size: 20px;
    }

    .table {
      width: 100%;
      border-collapse: collapse;
      min-width: 530px;
    }

    .table th, .table td {
      padding: 15px 12px;
      text-align: left;
      border-bottom: 1px solid #ffffff15;
    }

    .table th {
      color: #d6b45a;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .table tbody tr:hover {
      background: #ffffff08;
    }

    .rank {
      color: #d6b45a;
      font-weight: bold;
    }

    .points {
      color: #d6b45a;
      font-weight: bold;
      font-size: 17px;
    }

    .status {
      color: #c5d0c8;
      padding: 20px 0;
    }

    .notice {
      margin-top: 18px;
      color: #c5d0c8;
      font-size: 13px;
      line-height: 1.7;
    }

    footer {
      text-align: center;
      padding: 22px;
      color: #aab6ac;
      border-top: 1px solid #c9a64b33;
      font-size: 13px;
    }

    @media (max-width: 600px) {
      header { padding: 14px; }
      nav { align-items: flex-start; }
      nav a { margin-left: 0; margin-right: 12px; }
      main { padding: 28px 14px 40px; }
      .panel { padding: 12px; }
    }
  </style>
</head>

<body>
  <header>
    <nav>
      <div class="brand">♟ DYCHESS</div>
      <div>
        <a href="index.html">Home</a>
        <a href="news.html">News</a>
        <a href="hall-of-fame.html">Hall of Fame</a>
      </div>
    </nav>
  </header>

  <main>
    <div class="eyebrow">The Home of DYCHESS</div>
    <h1>🏆 Live Leaderboard</h1>
    

    <section class="panel">
      <h2>Player Rankings</h2>
      <div id="leaderboardBox" class="status">
        Loading DYCHESS leaderboard...
      </div>
      <div class="notice">
        <strong>DYCHESS League:</strong>
        1st place = 3 points · 2nd place = 2 points ·
        3rd place = 1 point.
      </div>
    </section>
  </main>

  <footer>© 2026 DYCHESS. Built for the community.</footer>

  <script>
    const SUPABASE_URL = 'https://puogdezkkgcgaxyzofoe.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_cKWMrNF-V40TZpdQp-ln6g_UvwbINQy';

    const db = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    function safeText(value) {
      const element = document.createElement('span');
      element.textContent = value ?? '';
      return element.innerHTML;
    }

    async function loadLeaderboard() {
      const box = document.getElementById('leaderboardBox');

      try {
        const { data, error } = await db
          .from('dychess_leaderboard')
          .select('*');

        if (error) throw error;

        if (!data || data.length === 0) {
          box.textContent = 'No DYCHESS players yet.';
          return;
        }

        data.sort((a, b) =>
          Number(b.dychess_points || 0) -
          Number(a.dychess_points || 0)
        );

        box.innerHTML = `
          <table class="table">
            <thead>
              <tr>
                <th>Rank</th>
                <th>Player</th>
              
                <th>DYCHESS Points</th>
              </tr>
            </thead>
            <tbody>
              ${data.map((p, i) => `
                <tr>
                  <td class="rank">${i + 1}</td>
                  <td>
                    <strong>${safeText(p.display_name)}</strong>
                    ${p.lichess_username
                      ? `<div style="color:#aab6ac;font-size:12px;margin-top:4px;">@${safeText(p.lichess_username)}</div>`
                      : ''}
                  </td>
                 
                  <td class="points">${Number(p.dychess_points || 0)}</td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        `;
      } catch (error) {
        console.error('Leaderboard error:', error);
        box.textContent =
          'Could not load the leaderboard. Please refresh and try again.';
      }
    }

    loadLeaderboard();
  </script>
</body>
</html>
